{% if courses %}
<div class="py-2 divide-y divide-gray-800">
  {% for course in courses %}
  <a href="{% url 'marketplace:course_detail' slug=course.slug %}"
     class="flex items-center gap-3 p-3 hover:bg-gray-800/80 transition-colors">
    <div class="w-10 h-8 rounded bg-gray-800 overflow-hidden flex-shrink-0">
      {% if course.thumbnail %}
      <img src="{{ course.thumbnail.url }}" alt="{{ course.title }}" class="w-full h-full object-cover">
      {% else %}
      <div class="w-full h-full bg-brand-900/60 flex items-center justify-center text-xs text-brand-300 font-bold">
        {{ course.title|first }}
      </div>
      {% endif %}
    </div>
    <div class="flex-1 min-w-0">
      <p class="text-xs font-semibold text-white truncate">{{ course.title }}</p>
      <p class="text-[10px] text-gray-400">{{ course.teacher.full_name }} • {{ course.currency }} {{ course.price }}</p>
    </div>
  </a>
  {% endfor %}
</div>
{% else %}
<div class="p-4 text-center text-xs text-gray-400">
  No courses matching "{{ q }}"
</div>
{% endif %}
