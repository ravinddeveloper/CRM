{% extends "base/base.html" %}

{% block title %}Set New Password — EduFlow LMS{% endblock %}

{% block body %}
<div class="min-h-screen bg-gray-950 flex flex-col justify-center py-12 sm:px-6 lg:px-8">
  <div class="sm:mx-auto sm:w-full sm:max-w-md text-center">
    <h2 class="text-2xl font-extrabold text-white">Enter new password</h2>
    <p class="mt-2 text-sm text-gray-400">Choose a strong password with at least 8 characters.</p>
  </div>

  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
    <div class="bg-gray-900 py-8 px-6 shadow-2xl rounded-2xl sm:px-10 border border-gray-800">
      <form method="post" action="" class="space-y-4">
        {% csrf_token %}
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1">New Password</label>
          <input type="password" name="password1" required minlength="8"
                 class="w-full px-4 py-2.5 bg-gray-800 border border-gray-700 rounded-xl text-white text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1">Confirm New Password</label>
          <input type="password" name="password2" required
                 class="w-full px-4 py-2.5 bg-gray-800 border border-gray-700 rounded-xl text-white text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none">
        </div>
        <button type="submit"
                class="w-full mt-2 py-3 px-4 bg-brand-600 hover:bg-brand-500 text-white font-bold rounded-xl shadow-lg shadow-brand-500/25 text-sm transition-all">
          Update Password
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
