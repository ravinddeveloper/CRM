{% extends "base/base.html" %}

{% block title %}Verify Your Email — EduFlow LMS{% endblock %}

{% block body %}
<div class="min-h-screen bg-gray-950 flex flex-col justify-center py-12 sm:px-6 lg:px-8 text-center">
  <div class="sm:mx-auto sm:w-full sm:max-w-md">
    <div class="w-16 h-16 bg-brand-500/10 border border-brand-500/20 text-brand-400 rounded-2xl flex items-center justify-center text-3xl mx-auto mb-6">
      ✉️
    </div>
    <h2 class="text-3xl font-extrabold text-white">Check your email</h2>
    <p class="mt-3 text-sm text-gray-400 leading-relaxed max-w-sm mx-auto">
      We sent a verification link to your email address. Please click the link to activate your account and start learning.
    </p>
    <div class="mt-8">
      <a href="{% url 'accounts:login' %}"
         class="inline-block px-6 py-2.5 bg-gray-800 hover:bg-gray-700 text-white rounded-xl text-sm font-semibold transition-all">
        Back to Sign In
      </a>
    </div>
  </div>
</div>
{% endblock %}
