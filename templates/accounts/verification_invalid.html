{% extends "base/base.html" %}

{% block title %}Invalid Verification Link — {{ PLATFORM_NAME }}{% endblock %}

{% block body %}
<div class="min-h-screen bg-gray-950 flex flex-col justify-center py-12 sm:px-6 lg:px-8 text-center">
  <div class="sm:mx-auto sm:w-full sm:max-w-md">
    <div class="w-16 h-16 bg-red-500/10 border border-red-500/20 text-red-400 rounded-2xl flex items-center justify-center text-3xl mx-auto mb-6">
      ⚠️
    </div>
    <h2 class="text-3xl font-extrabold text-white">Verification Link Expired</h2>
    <p class="mt-3 text-sm text-gray-400 leading-relaxed max-w-sm mx-auto">
      This verification link is invalid or has already been used. Please log in or request a new verification email.
    </p>
    <div class="mt-8">
      <a href="{% url 'accounts:login' %}"
         class="inline-block px-6 py-2.5 bg-brand-600 hover:bg-brand-500 text-white rounded-xl text-sm font-semibold transition-all">
        Go to Login
      </a>
    </div>
  </div>
</div>
{% endblock %}
