{% extends "base/base.html" %}

{% block title %}Section Form — Instructor Console{% endblock %}

{% block body %}
<div class="min-h-screen bg-gray-950 text-gray-100 pb-16">
  {% include "dashboard/teacher/_nav.html" %}
  <div class="max-w-xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="bg-gray-900 border border-gray-800 rounded-2xl p-8 shadow-2xl">
      <h2 class="text-2xl font-bold text-white mb-6">{% if is_create %}Create Section{% else %}Edit Section{% endif %}</h2>
      <form method="post" class="space-y-4">
        {% csrf_token %}
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1">Section Title</label>
          <input type="text" name="title" required value="{{ form.title.value|default:'' }}"
                 class="w-full px-4 py-2.5 bg-gray-800 border border-gray-700 rounded-xl text-white text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none"
                 placeholder="e.g. Module 1: Introduction to Models">
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1">Order Index</label>
          <input type="number" name="order" value="{{ form.order.value|default:'0' }}"
                 class="w-full px-4 py-2.5 bg-gray-800 border border-gray-700 rounded-xl text-white text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none">
        </div>
        <div class="pt-4 flex justify-end gap-3">
          <a href="{% url 'teacher:sections' course_id=course.id %}" class="px-4 py-2 bg-gray-800 text-gray-300 rounded-xl text-sm font-semibold">Cancel</a>
          <button type="submit" class="px-5 py-2 bg-brand-600 hover:bg-brand-500 text-white font-bold rounded-xl text-sm transition-all">Save Section</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
