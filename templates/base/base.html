<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ PLATFORM_NAME }}{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}A world-class online learning platform.{% endblock %}">
    {% if PLATFORM_FAVICON_URL %}<link rel="icon" href="{{ PLATFORM_FAVICON_URL }}">{% endif %}
    <meta name="theme-color" content="{{ PLATFORM_PRIMARY_COLOR }}">

    <!-- Tailwind CSS via CDN (swap for compiled build in production) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                50: 'color-mix(in srgb, var(--portal-primary) 8%, white)',
                100: 'color-mix(in srgb, var(--portal-primary) 16%, white)',
                200: 'color-mix(in srgb, var(--portal-primary) 30%, white)',
                300: 'color-mix(in srgb, var(--portal-primary) 50%, white)',
                400: 'color-mix(in srgb, var(--portal-primary) 70%, white)',
                500: 'var(--portal-primary)', 600: 'var(--portal-primary)',
                700: 'color-mix(in srgb, var(--portal-primary) 80%, black)',
                800: 'color-mix(in srgb, var(--portal-primary) 65%, black)',
                900: 'color-mix(in srgb, var(--portal-primary) 50%, black)'
              },
              primary: 'var(--portal-primary)', accent: 'var(--portal-accent)'
            },
            fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
          }
        }
      }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10" defer></script>

    <!-- Alpine.js -->
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <!-- Custom styles -->
    <style>
      {{ PORTAL_THEME_CSS|safe }}
      [x-cloak] { display: none !important; }
      .progress-bar { transition: width 0.4s ease-in-out; }
      .sidebar-link.active { background-color: var(--portal-primary); color: var(--portal-inverse-text); }
      html, body {
        overflow-x: hidden;
        max-width: 100vw;
      }
    </style>

    {% block extra_head %}{% endblock %}
</head>
<body class="min-h-full bg-gray-950 text-gray-100 font-sans antialiased overflow-x-hidden" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>

    <!-- Toast notifications container -->
    <div id="toast-container" class="fixed top-4 right-4 z-50 space-y-2" aria-live="polite"></div>

    {% block body %}{% endblock %}

    <!-- Alpine.js toast helper -->
    <script>
      function showToast(msg, type = 'info') {
        const colors = {
          success: 'bg-green-500', error: 'bg-red-500',
          info: 'bg-blue-500', warning: 'bg-yellow-500'
        };
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = `${colors[type]} text-white px-4 py-3 rounded-lg shadow-lg text-sm font-medium
                           flex items-center gap-2 max-w-sm transform transition-all duration-300`;
        toast.innerHTML = `<span>${msg}</span>
          <button onclick="this.parentElement.remove()" class="ml-auto text-white/80 hover:text-white">✕</button>`;
        container.appendChild(toast);
        setTimeout(() => toast.remove(), 4000);
      }
    </script>

    {% block extra_js %}{% endblock %}
</body>
</html>
