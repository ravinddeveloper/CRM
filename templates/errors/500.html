{% extends "base/base.html" %}
{% block title %}500 Server Error — {{ PLATFORM_NAME }}{% endblock %}
{% block body %}
<div class="min-h-screen bg-gray-950 flex flex-col justify-center items-center px-4 text-center">
  <div class="w-20 h-20 bg-red-500/10 border border-red-500/20 text-red-400 rounded-3xl flex items-center justify-center text-3xl mb-6 shadow-xl shadow-red-500/10">
    ⚡
  </div>
  <h1 class="text-3xl sm:text-4xl font-extrabold text-white">Something Went Wrong</h1>
  <p class="text-gray-400 mt-2 max-w-md text-sm sm:text-base">
    An unexpected error occurred on our end. Our engineering team has been notified.
  </p>
  <div class="mt-8">
    <a href="/" class="px-5 py-2.5 bg-brand-600 hover:bg-brand-500 text-white font-bold rounded-xl text-sm transition-all shadow-lg shadow-brand-500/20">
      Back to Safety
    </a>
  </div>
</div>
{% endblock %}
