version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# Django LMS – Development Docker Compose
# ─────────────────────────────────────────────────────────────────────────────
# Services:
#   web       – Django application (Gunicorn in prod / runserver in dev)
#   postgres  – PostgreSQL 15 database
#   mongodb   – optional MongoDB 7 service for migrated repository domains
#   redis     – Redis 7 (cache + Celery broker)
#   celery    – Celery worker for async tasks (emails, invoices, etc.)
#   celery-beat – Celery beat scheduler (periodic tasks)
#   minio     – S3-compatible object storage for videos/files
#   nginx     – Reverse proxy (serves static/media in dev too)
#
# Usage:
#   docker-compose up -d
#   docker-compose exec web python manage.py migrate
#   docker-compose exec web python manage.py seed_demo
# ─────────────────────────────────────────────────────────────────────────────

x-django-env: &django-env
  env_file:
    - .env
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.development
    DATABASE_ENGINE: ${DATABASE_ENGINE:-sql}
    DATABASE_URL: ""
    DB_HOST: postgres
    DB_PORT: 5432
    DB_NAME: ${POSTGRES_DB:-lmsdb}
    DB_USER: ${POSTGRES_USER:-lmsuser}
    DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    MONGO_URI: ${MONGO_URI_DOCKER:-mongodb://mongodb:27017}
    MONGO_DB_NAME: ${MONGO_DB_NAME:-myportal}
    MONGO_ENROLLMENT_SYNC_ENABLED: ${MONGO_ENROLLMENT_SYNC_ENABLED:-false}
    MONGO_NOTIFICATION_SYNC_ENABLED: ${MONGO_NOTIFICATION_SYNC_ENABLED:-false}
    MONGO_ACCOUNT_SYNC_ENABLED: ${MONGO_ACCOUNT_SYNC_ENABLED:-false}
    MONGO_COURSE_CATALOG_SYNC_ENABLED: ${MONGO_COURSE_CATALOG_SYNC_ENABLED:-false}
    # Google Drive storage (only needed when STORAGE_BACKEND=gdrive)
    GDRIVE_ROOT_FOLDER_ID: ${GDRIVE_ROOT_FOLDER_ID:-}
    GDRIVE_SHARED_DRIVE_ID: ${GDRIVE_SHARED_DRIVE_ID:-}
    GDRIVE_SERVICE_ACCOUNT_JSON: ${GDRIVE_SERVICE_ACCOUNT_JSON:-}
    GDRIVE_SERVICE_ACCOUNT_INFO: ${GDRIVE_SERVICE_ACCOUNT_INFO:-}
    GDRIVE_SIGNED_URL_EXPIRY: ${GDRIVE_SIGNED_URL_EXPIRY:-3600}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

x-django-volumes: &django-volumes
  volumes:
    - .:/app
    - static_volume:/app/staticfiles
    - media_volume:/app/media

services:

  # ──────────────────────────────────────────────────────────
  # PostgreSQL
  # ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lmsdb}
      POSTGRES_USER: ${POSTGRES_USER:-lmsuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lmsuser}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  # Optional MongoDB for migrated repositories. Start with --profile mongodb.
  mongodb:
    image: mongo:7
    profiles: ["mongodb"]
    restart: unless-stopped
    command: ["mongod", "--bind_ip_all"]
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:27017:27017"

  # ──────────────────────────────────────────────────────────
  # Redis
  # ──────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    ports:
      - "6379:6379"

  # ──────────────────────────────────────────────────────────
  # MinIO (S3-compatible object storage)
  # ──────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO Console UI
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Create default bucket on startup
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env};
        mc mb --ignore-existing myminio/${S3_BUCKET_NAME:-lms-private};
        mc anonymous set none myminio/${S3_BUCKET_NAME:-lms-private};
        echo 'MinIO bucket initialised.';
      "

  # ──────────────────────────────────────────────────────────
  # Django Web Application
  # ──────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    restart: unless-stopped
    <<: *django-env
    <<: *django-volumes
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ──────────────────────────────────────────────────────────
  # Celery Worker
  # ──────────────────────────────────────────────────────────
  celery:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    restart: unless-stopped
    <<: *django-env
    <<: *django-volumes
    command: celery -A config.celery worker --loglevel=info --concurrency=4
    depends_on:
      - web
      - redis

  # ──────────────────────────────────────────────────────────
  # Celery Beat (Periodic Tasks)
  # ──────────────────────────────────────────────────────────
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    restart: unless-stopped
    <<: *django-env
    <<: *django-volumes
    command: celery -A config.celery beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    depends_on:
      - web
      - redis

  # ──────────────────────────────────────────────────────────
  # Nginx (Reverse proxy + static files)
  # ──────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/staticfiles:ro
      - media_volume:/media:ro
    depends_on:
      - web

volumes:
  postgres_data:
  mongodb_data:
  redis_data:
  minio_data:
  static_volume:
  media_volume:
